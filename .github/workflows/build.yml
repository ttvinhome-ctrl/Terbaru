name: Build KAABA OS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cari dan ekstrak ZIP sumber
        run: |
          ZIP=$(ls KAABA-OS-TV*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip 2>/dev/null | head -1 || true); fi
          if [ -z "$ZIP" ]; then
            echo "::error::Tidak ada file .zip di root repo. Upload KAABA-OS-TV-v1_0-source.zip dulu."
            exit 1
          fi
          echo "Memakai ZIP: $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src
          # Cari folder yang berisi settings.gradle.kts (jaga-jaga kalau ZIP punya folder pembungkus)
          SETTINGS=$(find _src -name settings.gradle.kts -not -path "*/.*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan di dalam ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Folder proyek: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Ganti nama APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/KAABA-OS-TV-v1.0.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAABA-OS-debug
          path: dist/KAABA-OS-TV-v1.0.apk

      - name: Buat Release (APK bisa diunduh langsung dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/KAABA-OS-TV-v1.0.apk \
            --title "KAABA OS TV build ${{ github.run_number }}" \
            --notes "APK debug KAABA OS TV v1.0. Unduh file .apk di bawah lalu pasang di Google TV."
